<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0f172a">
  <title>Polpo — Claude Code Controller</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐙</text></svg>">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header id="app-header">
    <div class="header-left">
      <span class="logo">🐙</span>
      <h1>Polpo</h1>
    </div>
    <div class="header-right">
      <span id="connection-status" class="status-dot disconnected" title="Disconnected"></span>
      <span id="instance-count">0 instances</span>
    </div>
  </header>

  <!-- Instance List View -->
  <main id="view-list">
    <div id="empty-state" class="empty-state">
      <div class="empty-icon">🐙</div>
      <h2>No active sessions</h2>
      <p>Start a session or resume a past one from the list below.</p>
      <pre class="code-hint">polpo session --cwd /path/to/project</pre>
    </div>
    <div id="instance-list" class="instance-list"></div>

    <!-- Past Sessions -->
    <div id="sessions-section" class="sessions-section hidden">
      <div class="section-header">
        <h3>Recent Sessions</h3>
        <button id="btn-refresh-sessions" class="btn-icon" title="Refresh">&#8635;</button>
      </div>
      <div id="sessions-list" class="instance-list"></div>
    </div>
  </main>

  <!-- Instance Detail View -->
  <main id="view-detail" class="hidden">
    <div class="detail-header">
      <button id="btn-back" class="btn-icon" aria-label="Back">&#8592;</button>
      <div class="detail-title">
        <h2 id="detail-name">Instance</h2>
        <span id="detail-status" class="badge">idle</span>
      </div>
      <div class="detail-actions">
        <button id="btn-abort" class="btn-icon btn-danger" title="Abort">&#10005;</button>
      </div>
    </div>
    <div class="detail-meta">
      <span id="detail-project"></span>
      <span id="detail-type"></span>
    </div>

    <!-- Auto-approve indicator -->
    <div id="auto-approve-banner" class="auto-approve-banner hidden">
      <span>Auto-approve ON</span>
      <button id="btn-stop-auto-approve" class="btn btn-small">Stop</button>
    </div>

    <!-- Approval Banner -->
    <div id="approval-banner" class="approval-banner hidden">
      <div class="approval-info">
        <strong>Approval Required</strong>
        <p id="approval-description"></p>
        <code id="approval-command"></code>
      </div>
      <div class="approval-buttons">
        <button id="btn-approve" class="btn btn-approve">Approve</button>
        <button id="btn-approve-all" class="btn btn-approve-all">Approve All</button>
        <button id="btn-reject" class="btn btn-reject">Reject</button>
      </div>
    </div>

    <!-- Conversation -->
    <div id="conversation" class="conversation"></div>

    <!-- Input Area -->
    <div class="input-area">
      <div id="attachment-preview" class="attachment-preview hidden"></div>
      <div class="input-row">
        <button id="btn-attach" class="btn-icon btn-attach" title="Attach file">&#128206;</button>
        <textarea id="prompt-input" placeholder="Send a prompt..." rows="1"></textarea>
        <button id="btn-send" class="btn btn-send" disabled>&#9654;</button>
      </div>
      <input type="file" id="file-input" multiple hidden>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
