name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      # Runtime dependencies only. Fails on a critical advisory; the known
      # high ones (localtunnel's axios) are listed in docs/security.md.
      - name: Audit dependencies
        run: npm audit --omit=dev --audit-level=critical
