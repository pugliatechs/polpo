<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="tentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c4b5fd" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Subtle glow behind -->
  <ellipse cx="200" cy="210" rx="140" ry="120" fill="url(#glowGrad)"/>

  <!-- Tentacles (8 arms curling outward) -->
  <g fill="none" stroke-width="18" stroke-linecap="round">
    <!-- Back tentacles (drawn first, behind body) -->
    <!-- Left back -->
    <path d="M145,220 C115,270 90,310 65,330 Q50,342 55,355" stroke="url(#tentGrad)" opacity="0.7"/>
    <!-- Right back -->
    <path d="M255,220 C285,270 310,310 335,330 Q350,342 345,355" stroke="url(#tentGrad)" opacity="0.7"/>

    <!-- Left far -->
    <path d="M130,215 C95,240 60,265 40,290 Q28,308 38,318" stroke="url(#tentGrad)" opacity="0.8"/>
    <!-- Right far -->
    <path d="M270,215 C305,240 340,265 360,290 Q372,308 362,318" stroke="url(#tentGrad)" opacity="0.8"/>

    <!-- Left mid -->
    <path d="M150,230 C125,275 105,320 90,350 Q82,368 92,372" stroke="url(#tentGrad)" opacity="0.85"/>
    <!-- Right mid -->
    <path d="M250,230 C275,275 295,320 310,350 Q318,368 308,372" stroke="url(#tentGrad)" opacity="0.85"/>

    <!-- Left front -->
    <path d="M165,235 C150,285 140,335 130,365 Q125,380 135,382" stroke="url(#tentGrad)"/>
    <!-- Right front -->
    <path d="M235,235 C250,285 260,335 270,365 Q275,380 265,382" stroke="url(#tentGrad)"/>

    <!-- Suction cups (small dots along front tentacles) -->
    <g fill="#c4b5fd" opacity="0.5">
      <circle cx="157" cy="265" r="3"/>
      <circle cx="150" cy="295" r="3"/>
      <circle cx="145" cy="325" r="3"/>
      <circle cx="137" cy="355" r="3"/>
      <circle cx="243" cy="265" r="3"/>
      <circle cx="250" cy="295" r="3"/>
      <circle cx="255" cy="325" r="3"/>
      <circle cx="263" cy="355" r="3"/>
    </g>
  </g>

  <!-- Head / body -->
  <ellipse cx="200" cy="175" rx="85" ry="95" fill="url(#bodyGrad)"/>

  <!-- Head highlight -->
  <ellipse cx="185" cy="140" rx="40" ry="30" fill="white" opacity="0.08"/>

  <!-- Eyes -->
  <g>
    <!-- Left eye white -->
    <ellipse cx="172" cy="175" rx="22" ry="25" fill="#f0f0ff"/>
    <!-- Right eye white -->
    <ellipse cx="228" cy="175" rx="22" ry="25" fill="#f0f0ff"/>

    <!-- Left pupil -->
    <ellipse cx="175" cy="178" rx="11" ry="14" fill="#1e1b4b"/>
    <!-- Right pupil -->
    <ellipse cx="231" cy="178" rx="11" ry="14" fill="#1e1b4b"/>

    <!-- Eye shine -->
    <circle cx="180" cy="170" r="5" fill="white" opacity="0.9"/>
    <circle cx="236" cy="170" r="5" fill="white" opacity="0.9"/>
    <circle cx="173" cy="182" r="2.5" fill="white" opacity="0.5"/>
    <circle cx="229" cy="182" r="2.5" fill="white" opacity="0.5"/>
  </g>

  <!-- Subtle smile -->
  <path d="M185,205 Q200,218 215,205" fill="none" stroke="#4338ca" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>

  <!-- Terminal/code symbol on forehead -->
  <g transform="translate(200,130)" opacity="0.35">
    <text text-anchor="middle" font-family="monospace" font-size="22" fill="white" font-weight="bold">&gt;_</text>
  </g>
</svg>
