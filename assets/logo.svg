<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <linearGradient id="bodyLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fca5a5"/>
      <stop offset="100%" stop-color="#f87171"/>
    </linearGradient>
    <linearGradient id="spot" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fecaca"/>
      <stop offset="100%" stop-color="#fca5a5"/>
    </linearGradient>
    <radialGradient id="headShine" cx="40%" cy="35%" r="50%">
      <stop offset="0%" stop-color="#fecaca" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#f87171" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cheek" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#dc2626" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#dc2626" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- === TENTACLES (8 arms, drawn behind head) === -->
  <g fill="none" stroke-linecap="round">

    <!-- Arm 1: far left, curling left -->
    <path d="M195,280 C150,310 100,330 70,360 Q50,380 60,400 Q70,415 85,405"
          stroke="url(#bodyLight)" stroke-width="28"/>
    <path d="M195,280 C150,310 100,330 70,360 Q50,380 60,400 Q70,415 85,405"
          stroke="url(#body)" stroke-width="22"/>
    <!-- suckers -->
    <circle cx="150" cy="315" r="5" fill="url(#spot)" opacity="0.7"/>
    <circle cx="110" cy="340" r="5" fill="url(#spot)" opacity="0.7"/>
    <circle cx="80" cy="368" r="4.5" fill="url(#spot)" opacity="0.7"/>
    <circle cx="66" cy="393" r="4" fill="url(#spot)" opacity="0.7"/>

    <!-- Arm 2: left, curling down-left -->
    <path d="M215,300 C185,350 160,400 145,440 Q138,460 150,468 Q162,472 168,458"
          stroke="url(#bodyLight)" stroke-width="28"/>
    <path d="M215,300 C185,350 160,400 145,440 Q138,460 150,468 Q162,472 168,458"
          stroke="url(#body)" stroke-width="22"/>
    <circle cx="195" cy="345" r="5" fill="url(#spot)" opacity="0.7"/>
    <circle cx="173" cy="388" r="5" fill="url(#spot)" opacity="0.7"/>
    <circle cx="155" cy="428" r="4.5" fill="url(#spot)" opacity="0.7"/>

    <!-- Arm 3: center-left, curling down -->
    <path d="M240,310 C230,365 225,420 228,460 Q230,480 245,478 Q258,474 254,456"
          stroke="url(#bodyLight)" stroke-width="26"/>
    <path d="M240,310 C230,365 225,420 228,460 Q230,480 245,478 Q258,474 254,456"
          stroke="url(#body)" stroke-width="20"/>
    <circle cx="234" cy="365" r="5" fill="url(#spot)" opacity="0.7"/>
    <circle cx="228" cy="415" r="4.5" fill="url(#spot)" opacity="0.7"/>
    <circle cx="230" cy="452" r="4" fill="url(#spot)" opacity="0.7"/>

    <!-- Arm 4: center-right, curling down -->
    <path d="M280,310 C290,365 295,420 292,460 Q290,480 275,478 Q262,474 266,456"
          stroke="url(#bodyLight)" stroke-width="26"/>
    <path d="M280,310 C290,365 295,420 292,460 Q290,480 275,478 Q262,474 266,456"
          stroke="url(#body)" stroke-width="20"/>
    <circle cx="286" cy="365" r="5" fill="url(#spot)" opacity="0.7"/>
    <circle cx="292" cy="415" r="4.5" fill="url(#spot)" opacity="0.7"/>
    <circle cx="290" cy="452" r="4" fill="url(#spot)" opacity="0.7"/>

    <!-- Arm 5: right, curling down-right -->
    <path d="M305,300 C335,350 360,400 375,440 Q382,460 370,468 Q358,472 352,458"
          stroke="url(#bodyLight)" stroke-width="28"/>
    <path d="M305,300 C335,350 360,400 375,440 Q382,460 370,468 Q358,472 352,458"
          stroke="url(#body)" stroke-width="22"/>
    <circle cx="325" cy="345" r="5" fill="url(#spot)" opacity="0.7"/>
    <circle cx="348" cy="388" r="5" fill="url(#spot)" opacity="0.7"/>
    <circle cx="365" cy="428" r="4.5" fill="url(#spot)" opacity="0.7"/>

    <!-- Arm 6: far right, curling right -->
    <path d="M325,280 C370,310 420,330 450,360 Q470,380 460,400 Q450,415 435,405"
          stroke="url(#bodyLight)" stroke-width="28"/>
    <path d="M325,280 C370,310 420,330 450,360 Q470,380 460,400 Q450,415 435,405"
          stroke="url(#body)" stroke-width="22"/>
    <circle cx="370" cy="315" r="5" fill="url(#spot)" opacity="0.7"/>
    <circle cx="410" cy="340" r="5" fill="url(#spot)" opacity="0.7"/>
    <circle cx="440" cy="368" r="4.5" fill="url(#spot)" opacity="0.7"/>
    <circle cx="454" cy="393" r="4" fill="url(#spot)" opacity="0.7"/>

    <!-- Arm 7: upper-left, curling up-left (behind head) -->
    <path d="M185,240 C140,245 100,265 75,295 Q60,315 72,328 Q84,335 92,320"
          stroke="url(#bodyLight)" stroke-width="26"/>
    <path d="M185,240 C140,245 100,265 75,295 Q60,315 72,328 Q84,335 92,320"
          stroke="url(#body)" stroke-width="20"/>
    <circle cx="138" cy="250" r="4.5" fill="url(#spot)" opacity="0.7"/>
    <circle cx="100" cy="272" r="4.5" fill="url(#spot)" opacity="0.7"/>
    <circle cx="78" cy="300" r="4" fill="url(#spot)" opacity="0.7"/>

    <!-- Arm 8: upper-right, curling up-right (behind head) -->
    <path d="M335,240 C380,245 420,265 445,295 Q460,315 448,328 Q436,335 428,320"
          stroke="url(#bodyLight)" stroke-width="26"/>
    <path d="M335,240 C380,245 420,265 445,295 Q460,315 448,328 Q436,335 428,320"
          stroke="url(#body)" stroke-width="20"/>
    <circle cx="382" cy="250" r="4.5" fill="url(#spot)" opacity="0.7"/>
    <circle cx="420" cy="272" r="4.5" fill="url(#spot)" opacity="0.7"/>
    <circle cx="442" cy="300" r="4" fill="url(#spot)" opacity="0.7"/>
  </g>

  <!-- === HEAD === -->
  <ellipse cx="260" cy="195" rx="110" ry="130" fill="url(#body)"/>
  <!-- Shine highlight -->
  <ellipse cx="260" cy="195" rx="110" ry="130" fill="url(#headShine)"/>

  <!-- Darker patch on top-right of head -->
  <ellipse cx="305" cy="155" rx="45" ry="55" fill="#dc2626" opacity="0.25" transform="rotate(-15,305,155)"/>

  <!-- === FACE === -->

  <!-- Left eye -->
  <ellipse cx="225" cy="200" rx="24" ry="28" fill="white"/>
  <ellipse cx="228" cy="205" rx="13" ry="16" fill="#1a1a2e"/>
  <circle cx="233" cy="196" r="6" fill="white" opacity="0.9"/>
  <circle cx="225" cy="210" r="3" fill="white" opacity="0.4"/>

  <!-- Right eye -->
  <ellipse cx="295" cy="200" rx="24" ry="28" fill="white"/>
  <ellipse cx="298" cy="205" rx="13" ry="16" fill="#1a1a2e"/>
  <circle cx="303" cy="196" r="6" fill="white" opacity="0.9"/>
  <circle cx="295" cy="210" r="3" fill="white" opacity="0.4"/>

  <!-- Smile -->
  <path d="M240,245 Q260,268 280,245" fill="none" stroke="#b91c1c" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Cheeks -->
  <ellipse cx="210" cy="240" rx="18" ry="12" fill="url(#cheek)"/>
  <ellipse cx="310" cy="240" rx="18" ry="12" fill="url(#cheek)"/>
</svg>
